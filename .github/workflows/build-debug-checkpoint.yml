name: C++ Level 3 native course source

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-debug-source-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Verify intentional learner failure, corrected totals and multi-file builds
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CLASSES_AUDIT_PARENT_TASK_ID: cppi0-build-debug-source-ci
        run: python3 verify-build-debug.py
      - name: Verify notebook printers and examples against the actual checkpoint
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CLASSES_AUDIT_PARENT_TASK_ID: cppi0-notebook-source-ci
        run: python3 verify-notebook.py
      - name: Verify inventory views and allocation-failure state preservation
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CLASSES_AUDIT_PARENT_TASK_ID: cpp3-inventory-source-ci
        run: python3 verify-inventory.py
      - name: Verify task commands, saved-file recovery and completed learner behavior
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CLASSES_AUDIT_PARENT_TASK_ID: cppi1-task-manager-source-ci
        run: python3 verify-task-manager.py
      - name: Verify selective imports, line rejection reports and fatal-read rollback
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CLASSES_AUDIT_PARENT_TASK_ID: cppi1-row-import-source-ci
        run: python3 verify-row-import.py
      - name: Verify bounded recursive search, paths, backtracking and parser failures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CLASSES_AUDIT_PARENT_TASK_ID: cppi2-maze-search-source-ci
        run: python3 verify-maze-search.py
      - name: Verify recursion worksheet traces against the saved maze and independent models
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CLASSES_AUDIT_PARENT_TASK_ID: cppi2-recursion-trace-source-ci
        run: python3 verify-recursion-trace.py
      - name: Verify container audit against real inventory probes and independent row models
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CLASSES_AUDIT_PARENT_TASK_ID: cppi3-container-audit-source-ci
        run: python3 verify-container-audit.py
      - name: Verify resource-safe reports, bounded input and real publication failures
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CXX: g++
          CLASSES_AUDIT_PARENT_TASK_ID: cppi4-file-processor-source-ci
        run: python3 verify-file-processor.py
      - name: Verify ownership worksheet output and real post-acquisition exceptions
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CXX: g++
          CLASSES_AUDIT_PARENT_TASK_ID: cppi4-ownership-source-ci
        run: python3 verify-ownership-worksheet.py
      - name: Verify ownership and error-boundary lesson programs and changed cases
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CXX: g++
          CLASSES_AUDIT_PARENT_TASK_ID: cppi4-lessons-source-ci
        run: python3 verify-cppi4-lessons.py
      - name: Verify all four CPPI4 Make packs and preserved CMake targets
        env:
          PYTHONDONTWRITEBYTECODE: '1'
          CXX: g++
          CLASSES_AUDIT_PARENT_TASK_ID: cppi4-builds-source-ci
        run: python3 verify-cppi4-builds.py
